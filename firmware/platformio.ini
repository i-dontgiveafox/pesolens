; pesos firmware — Seeed XIAO ESP32-S3 Sense
; PlatformIO + Arduino framework
; Hardware: XIAO ESP32-S3 Sense (8 MB PSRAM, 8 MB flash, OV2640/OV3660 camera)
; Audio out: I2S → MAX98357A → bone-conduction speaker
; Trigger: tactile push button on D4/GPIO5 (active-low, deep-sleep wake)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Custom partition table (~5.06 MB app + ~2.88 MB SPIFFS for audio)
board_build.partitions = partitions.csv

; PSRAM in OPI (octal) mode — required for XIAO ESP32-S3 Sense's 8 MB PSRAM
board_build.psram_mode = opi
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 5308416

; Custom sdkconfig for SPIRAM/CPU tweaks
board_build.sdkconfig_options = sdkconfig.defaults

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ARDUHAL_LOG_COLORS
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    ; Temporary USB serial debug: keeps the ESP32-S3 awake and prints a heartbeat.
    ; Comment this out for the normal battery/deep-sleep build.
    -DPESOS_DEBUG_NO_SLEEP

; Library dependencies
; TFLite Micro is INTENTIONALLY OMITTED from lib_deps in this build.
; inference.cpp is gated by ENABLE_TFLITE_MICRO (default 0) so it compiles
; cleanly without any TFLite library and runs in stub mode (returns no
; detections, plays the "error" clip when triggered). To enable real
; on-device inference: switch to `framework = arduino, espidf` mixed mode,
; add esp-tflite-micro via the ESP-IDF Component Manager, and rebuild
; with `-DENABLE_TFLITE_MICRO=1`. See docs/SETUP_GUIDE.md → Known build issues.
;
; Audio uses the built-in ESP-IDF I2S driver (driver/i2s.h) — no extra lib needed.
lib_deps =
    espressif/esp32-camera

; SPIFFS uploads from the data/ folder
board_build.filesystem = spiffs

build_src_filter =
    +<*>
    -<serial_probe.cpp>
    -<audio_probe.cpp>
    -<gpio_probe.cpp>

[env:seeed_xiao_esp32s3_tflm]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino, espidf

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.psram_mode = opi
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 5308416
board_build.sdkconfig_options = sdkconfig.defaults

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ARDUHAL_LOG_COLORS
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DENABLE_TFLITE_MICRO=1
    ; esp32-camera is used as a PlatformIO library here, so provide the
    ; Kconfig defaults it normally receives when built as an ESP-IDF component.
    -DCONFIG_OV2640_SUPPORT=1
    -DCONFIG_OV3660_SUPPORT=1
    -DCONFIG_SCCB_HARDWARE_I2C_PORT1=1
    -DCONFIG_SCCB_CLK_FREQ=100000
    -DCONFIG_CAMERA_TASK_STACK_SIZE=2048
    -DCONFIG_CAMERA_CORE0=1
    -DCONFIG_CAMERA_DMA_BUFFER_SIZE_MAX=32768
    ; USB demo mode: keep the board awake and scan repeatedly without the
    ; D4/GPIO5 wake button. Remove this for final battery/deep-sleep behavior.
    -DPESOS_CONTINUOUS_SCAN

; In mixed Arduino + ESP-IDF mode, use the ESP-IDF component-manager
; dependency from src/idf_component.yml. The PlatformIO library build excludes
; esp32-camera's target/esp32s3 low-level sources and fails at link time.
lib_deps =

board_build.filesystem = spiffs

[env:seeed_xiao_esp32s3_tflm_frame_dump]
extends = env:seeed_xiao_esp32s3_tflm
build_flags =
    ${env:seeed_xiao_esp32s3_tflm.build_flags}
    -DPESOS_DUMP_FIRST_FRAME

[env:seeed_xiao_esp32s3_tflm_detect_dump]
extends = env:seeed_xiao_esp32s3_tflm
build_flags =
    ${env:seeed_xiao_esp32s3_tflm.build_flags}
    -DPESOS_DUMP_DETECTED_FRAMES

[env:seeed_xiao_esp32s3_tflm_button_capture]
extends = env:seeed_xiao_esp32s3_tflm
build_flags =
    ${env:seeed_xiao_esp32s3_tflm.build_flags}
    -DPESOS_MANUAL_CAPTURE

[env:seeed_xiao_esp32s3_tflm_button_capture_dump]
extends = env:seeed_xiao_esp32s3_tflm
build_flags =
    ${env:seeed_xiao_esp32s3_tflm.build_flags}
    -DPESOS_MANUAL_CAPTURE
    -DPESOS_DUMP_EACH_CAPTURE

[env:seeed_xiao_esp32s3_tflm_auto_capture_dump_8s]
extends = env:seeed_xiao_esp32s3_tflm
build_flags =
    ${env:seeed_xiao_esp32s3_tflm.build_flags}
    -DPESOS_CAPTURE_ONLY_DUMP
    -DPESOS_DUMP_EACH_CAPTURE
    -DPESOS_NO_SERIAL_WAIT
    -DAUTO_CAPTURE_INTERVAL_MS=8000

[env:seeed_xiao_esp32s3_tflm_auto_run_d6_led]
extends = env:seeed_xiao_esp32s3_tflm
build_flags =
    ${env:seeed_xiao_esp32s3_tflm.build_flags}
    ; Standalone battery/demo firmware: power on -> initialize -> scan loop.
    ; No host-side monitor script and no D6 capture button are required.
    -DPESOS_NO_SERIAL_WAIT
    ; XIAO D6 maps to GPIO43 in the installed Arduino variant.
    -DREADY_LED_PIN=43
    -DREADY_LED_XIAO_D_PIN=6
    -DCAPTURE_BUTTON_PIN=-1

[env:serial_probe]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.psram_mode = opi
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_src_filter =
    -<*>
    +<serial_probe.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:audio_probe]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.psram_mode = opi
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.filesystem = spiffs
build_src_filter =
    -<*>
    +<audio.cpp>
    +<audio_probe.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- Host-side test env ----------
; Pure-logic modules (speech.cpp) compile + run on the dev machine for fast TDD.
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -I src
build_src_filter =
    +<speech.cpp>
test_filter = test_speech

; Button wiring probe: pull-up on every free XIAO D pin, print level changes.
[env:gpio_probe]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_src_filter =
    -<*>
    +<gpio_probe.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
